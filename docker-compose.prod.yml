name: ${COMPOSE_PROJECT_NAME:-global-erp}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - app_net
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    image: global-erp-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    networks:
      - app_net
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: global-erp-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      UPLOAD_ROOT: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - app_net
    logging: *default-logging

  mongo-keyfile:
    image: mongo:7.0
    restart: "no"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        if [ ! -s /keyfile/mongo-keyfile ]; then
          head -c 756 /dev/urandom | base64 | tr -d '\n' > /keyfile/mongo-keyfile
          chmod 400 /keyfile/mongo-keyfile
          chown 999:999 /keyfile/mongo-keyfile
          echo "Generated MongoDB replica set keyfile"
        else
          echo "Replica set keyfile already present"
        fi
    volumes:
      - mongo_keyfile:/keyfile
    networks:
      - app_net
    logging: *default-logging

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    command:
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /etc/mongo/mongo-keyfile
      - --auth
      - --wiredTigerCacheSizeGB
      - ${MONGO_WIREDTIGER_CACHE_GB:-0.5}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env.production}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env.production}
      MONGO_ROOT_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@127.0.0.1:27017/admin?directConnection=true"
      MONGODB_DB: ${MONGODB_DB:-global_ecommerce_erp}
      TZ: UTC
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/etc/mongo:ro
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh "$$MONGO_ROOT_URI" --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 20
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    stop_grace_period: 60s
    networks:
      - app_net
    logging: *default-logging

  mongo-init:
    image: mongo:7.0
    restart: "no"
    entrypoint:
      - /bin/bash
      - /scripts/init-replica.sh
    environment:
      MONGO_HOST: mongodb:27017
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env.production}
      MONGODB_DB: ${MONGODB_DB:-global_ecommerce_erp}
    volumes:
      - ./infrastructure/mongo/init-replica.sh:/scripts/init-replica.sh:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_net
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --requirepass "$$REDIS_PASSWORD"
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - app_net
    logging: *default-logging

networks:
  app_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
  mongo_keyfile:
  redis_data:
  uploads_data:
