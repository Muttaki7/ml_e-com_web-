version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: bd-erp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: global_ecommerce_erp

  redis:
    image: redis:7-alpine
    container_name: bd-erp-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bd-erp-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: global_ecommerce_erp
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: docker-dev-secret-change-in-production-please-use-long-random
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bd-erp-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  mongo_data: